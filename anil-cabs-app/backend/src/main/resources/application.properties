spring.application.name=screen-management
spring.datasource.url=${DB_URL:jdbc:h2:mem:anilcabs;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
server.port=${PORT:8080}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,https://*.vercel.app}
